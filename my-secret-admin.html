<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex min-h-screen font-sans text-gray-800">

    <!-- Login Screen -->
    <div id="login-screen" class="flex-1 flex items-center justify-center bg-white absolute inset-0 z-50">
        <div class="bg-gray-50 p-8 rounded-lg shadow-md w-96 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Admin Login</h2>
            <input type="password" id="pat-token" placeholder="Enter GitHub Token (ghp_...)" class="w-full p-3 border rounded mb-4 focus:outline-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">Access Dashboard</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col hidden">
        <div class="p-6 text-xl font-bold border-b border-slate-700 text-blue-400">EV Portal Control</div>
        <div class="p-4 flex-1">
            <button onclick="showTab('settings-tab')" class="w-full text-left p-3 mb-2 rounded hover:bg-slate-800 bg-slate-800">⚙️ Site Settings</button>
            <button onclick="showTab('add-car-tab')" class="w-full text-left p-3 mb-2 rounded hover:bg-slate-800">🚗 Add New EV</button>
            <button onclick="showTab('json-tab')" class="w-full text-left p-3 mb-2 rounded hover:bg-slate-800">💻 Advanced Data</button>
        </div>
        <button onclick="logout()" class="p-4 bg-red-600 hover:bg-red-700 font-bold text-center">🚪 Logout</button>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="flex-1 p-10 hidden">
        
        <!-- Tab: Settings -->
        <div id="settings-tab" class="tab-content bg-white p-6 rounded shadow-sm border">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Website Settings</h2>
            <p class="text-gray-500 mb-4">Basic configuration setup.</p>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Website Name</label>
                <input type="text" id="site-name" class="w-full p-2 border rounded" placeholder="e.g. EV Duniya">
            </div>
            <button onclick="alert('Settings save functionality coming next!')" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">Update Settings</button>
        </div>

        <!-- Tab: Add New EV Car (NEW VISUAL FORM) -->
        <div id="add-car-tab" class="tab-content hidden bg-white p-6 rounded shadow-sm border">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Add New Electric Car</h2>
            <p class="text-gray-500 mb-6">Fill this form to easily add a new EV to your website.</p>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Car Name</label>
                    <input type="text" id="car-name" class="w-full p-2 border rounded" placeholder="e.g. Tata Nexon EV">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Brand</label>
                    <input type="text" id="car-brand" class="w-full p-2 border rounded" placeholder="e.g. Tata">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Range (km)</label>
                    <input type="number" id="car-range" class="w-full p-2 border rounded" placeholder="e.g. 465">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Battery (kWh)</label>
                    <input type="number" id="car-battery" class="w-full p-2 border rounded" placeholder="e.g. 40.5">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Price</label>
                    <input type="text" id="car-price" class="w-full p-2 border rounded" placeholder="e.g. ₹14.49 Lakh">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Image URL</label>
                    <input type="text" id="car-image" class="w-full p-2 border rounded" placeholder="https://link-to-car-image.jpg">
                </div>
            </div>
            <button onclick="saveNewCar()" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700">Save Car to Database</button>
            <p id="car-status" class="mt-3 font-bold text-green-600 hidden">✅ Car successfully added to JSON!</p>
        </div>

        <!-- Tab: JSON Editor -->
        <div id="json-tab" class="tab-content hidden bg-white p-6 rounded shadow-sm border">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Raw JSON Data</h2>
            <p class="text-gray-500 mb-4">For advanced edits. Select a file to load:</p>
            <div class="flex gap-2 mb-4">
                <button onclick="loadJson('cars.json')" class="bg-gray-200 px-3 py-1 rounded border hover:bg-gray-300">cars.json</button>
                <button onclick="loadJson('blogs.json')" class="bg-gray-200 px-3 py-1 rounded border hover:bg-gray-300">blogs.json</button>
            </div>
            <textarea id="json-editor" class="w-full h-64 p-3 border rounded font-mono text-sm bg-gray-50 mb-4"></textarea>
            <button onclick="saveJson()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">Commit Changes to GitHub</button>
        </div>

    </div>

    <script>
        // === AAPKI GITHUB REPO DETAILS ===
        const REPO = "jaatbott/ev-portal"; 
        
        let token = localStorage.getItem('ev_pat');
        let currentFileSha = "";
        let currentFileName = "";

        // Auto-login check
        if(token) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        function login() {
            token = document.getElementById('pat-token').value;
            if(token.trim() !== "") {
                localStorage.setItem('ev_pat', token);
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('ev_pat');
            location.reload();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        // GITHUB API SE FILE LOAD KARNA
        async function loadJson(filename) {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/data/${filename}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                
                if (data.content) {
                    currentFileSha = data.sha;
                    currentFileName = filename;
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    document.getElementById('json-editor').value = decodedContent;
                    alert(`${filename} loaded successfully!`);
                }
            } catch (error) {
                alert("Error loading file. Check console.");
                console.error(error);
            }
        }

        // RAW JSON SAVE KARNA (Advanced tab)
        async function saveJson() {
            if (!currentFileName || !currentFileSha) return alert("Please load a file first!");
            const content = document.getElementById('json-editor').value;
            await commitToGitHub(currentFileName, content, currentFileSha);
        }

        // NAYI CAR SAVE KARNE KA MAGIC (Visual Form tab)
        async function saveNewCar() {
            try {
                // 1. Inputs collect karein
                const name = document.getElementById('car-name').value;
                const brand = document.getElementById('car-brand').value;
                const range = document.getElementById('car-range').value;
                const battery = document.getElementById('car-battery').value;
                const price = document.getElementById('car-price').value;
                const image = document.getElementById('car-image').value;

                if(!name || !brand) return alert("Car Name and Brand are mandatory!");

                document.getElementById('car-status').textContent = "⏳ Saving...";
                document.getElementById('car-status').classList.remove('hidden');

                // 2. Github se current cars.json fetch karein
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/data/cars.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                
                let carsArray = [];
                let sha = "";
                
                if (data.content) {
                    sha = data.sha;
                    const decodedStr = decodeURIComponent(escape(atob(data.content)));
                    // Agar file khali hai, toh empty array set karein
                    carsArray = decodedStr.trim() === "" || decodedStr.trim() === "{}" ? [] : JSON.parse(decodedStr);
                }

                // 3. Nayi car ko array mein add karein
                const newCarObj = {
                    id: Date.now(),
                    name: name,
                    brand: brand,
                    range_km: parseInt(range),
                    battery_kwh: parseFloat(battery),
                    price: price,
                    image: image
                };
                carsArray.push(newCarObj);

                // 4. Update ki hui array ko wapas GitHub par bhejein
                await commitToGitHub('cars.json', JSON.stringify(carsArray, null, 2), sha);
                
                // Form clear karein
                document.querySelectorAll('#add-car-tab input').forEach(input => input.value = '');
                document.getElementById('car-status').textContent = "✅ Car successfully added to JSON!";
                
                setTimeout(() => { document.getElementById('car-status').classList.add('hidden'); }, 3000);

            } catch(err) {
                alert("Error saving car! Check if cars.json exists and is a valid JSON array.");
                console.error(err);
            }
        }

        // CORE GITHUB COMMIT FUNCTION
        async function commitToGitHub(filename, contentStr, shaStr) {
            const encodedContent = btoa(unescape(encodeURIComponent(contentStr)));
            const body = {
                message: `Admin update via panel: ${filename}`,
                content: encodedContent,
                sha: shaStr
            };

            const response = await fetch(`https://api.github.com/repos/${REPO}/contents/data/${filename}`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                if (filename !== 'cars.json') alert(`${filename} updated successfully!`);
            } else {
                const err = await response.json();
                alert("GitHub Error: " + err.message);
            }
        }
    </script>
</body>
</html>
