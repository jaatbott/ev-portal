<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Portal Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex min-h-screen font-sans text-gray-800">

    <!-- Login Screen -->
    <div id="login-screen" class="flex-1 flex items-center justify-center bg-white absolute inset-0 z-50">
        <div class="bg-gray-50 p-8 rounded-lg shadow-md w-96 text-center border">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Admin Login</h2>
            <input type="password" id="pat-token" placeholder="Enter GitHub Token (ghp_...)" class="w-full p-3 border rounded mb-4 focus:outline-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">Access Control Panel</button>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col hidden">
        <div class="p-6 text-xl font-bold border-b border-slate-700 text-blue-400">EV Portal Master</div>
        <div class="p-4 flex-1 space-y-2">
            <button onclick="showTab('settings-tab')" class="w-full text-left p-3 rounded hover:bg-slate-800 bg-slate-800">⚙️ Site Settings</button>
            <button onclick="showTab('add-car-tab')" class="w-full text-left p-3 rounded hover:bg-slate-800">🚗 Add New EV Car</button>
            <button onclick="showTab('add-blog-tab')" class="w-full text-left p-3 rounded hover:bg-slate-800">📝 Write Blog Post</button>
        </div>
        <button onclick="logout()" class="p-4 bg-red-600 hover:bg-red-700 font-bold text-center">🚪 Logout</button>
    </div>

    <!-- Main Dashboard Content -->
    <div id="main-content" class="flex-1 p-6 md:p-10 hidden overflow-y-auto">
        
        <!-- Tab 1: Site Settings -->
        <div id="settings-tab" class="tab-content bg-white p-6 rounded shadow-sm border max-w-2xl">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Website Settings</h2>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Website Name</label>
                <input type="text" id="set-name" class="w-full p-2 border rounded" placeholder="EV Duniya">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Global SEO Description</label>
                <textarea id="set-desc" class="w-full p-2 border rounded h-24" placeholder="Best portal for electric vehicles..."></textarea>
            </div>
            <button onclick="saveSettings()" class="bg-blue-600 text-white px-5 py-2 rounded font-bold hover:bg-blue-700">Update Settings</button>
            <p id="settings-status" class="mt-2 text-sm font-bold text-green-600 hidden">✅ Settings updated successfully!</p>
        </div>

        <!-- Tab 2: Add New EV Car -->
        <div id="add-car-tab" class="tab-content hidden bg-white p-6 rounded shadow-sm border max-w-3xl">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Add New Electric Car</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Car Name</label>
                    <input type="text" id="car-name" class="w-full p-2 border rounded" placeholder="Tata Nexon EV">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Brand</label>
                    <input type="text" id="car-brand" class="w-full p-2 border rounded" placeholder="Tata">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Range (km)</label>
                    <input type="number" id="car-range" class="w-full p-2 border rounded" placeholder="465">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Battery (kWh)</label>
                    <input type="number" id="car-battery" class="w-full p-2 border rounded" placeholder="40.5">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Price</label>
                    <input type="text" id="car-price" class="w-full p-2 border rounded" placeholder="₹14.49 Lakh">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Image URL</label>
                    <input type="text" id="car-image" class="w-full p-2 border rounded" placeholder="https://image-link.jpg">
                </div>
            </div>
            <button onclick="saveNewCar()" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700">Save Car to Database</button>
            <p id="car-status" class="mt-3 font-bold text-green-600 hidden">✅ Car successfully added!</p>
        </div>

        <!-- Tab 3: Write Blog Post -->
        <div id="add-blog-tab" class="tab-content hidden bg-white p-6 rounded shadow-sm border max-w-3xl">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Publish New Blog Post</h2>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Blog Title</label>
                <input type="text" id="blog-title" class="w-full p-2 border rounded" placeholder="Top 5 EVs to buy">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Featured Image URL</label>
                <input type="text" id="blog-image" class="w-full p-2 border rounded" placeholder="https://image-link.jpg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Blog Content / Article</label>
                <textarea id="blog-content" class="w-full p-2 border rounded h-40" placeholder="Write your full article here..."></textarea>
            </div>
            <button onclick="saveNewBlog()" class="bg-purple-600 text-white px-6 py-2 rounded font-bold hover:bg-purple-700">Publish Blog</button>
            <p id="blog-status" class="mt-3 font-bold text-green-600 hidden">✅ Blog published successfully!</p>
        </div>

    </div>

    <!-- JavaScript Engine -->
    <script>
        const REPO = "jaatbott/ev-portal"; 
        let token = localStorage.getItem('ev_pat');

        if(token) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        function login() {
            token = document.getElementById('pat-token').value;
            if(token.trim() !== "") {
                localStorage.setItem('ev_pat', token);
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('ev_pat');
            location.reload();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('bg-slate-800'));
            event.currentTarget.classList.add('bg-slate-800');
        }

        // Save Settings
        async function saveSettings() {
            try {
                const name = document.getElementById('set-name').value;
                const desc = document.getElementById('set-desc').value;
                const settingsObj = { site_name: name, seo_description: desc };

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/settings.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                await commitToGitHub('settings.json', JSON.stringify(settingsObj, null, 2), data.sha);
                
                document.getElementById('settings-status').classList.remove('hidden');
                setTimeout(() => document.getElementById('settings-status').classList.add('hidden'), 3000);
            } catch(err) { alert("Error saving settings."); }
        }

        // Save New EV Car
        async function saveNewCar() {
            try {
                const name = document.getElementById('car-name').value;
                const brand = document.getElementById('car-brand').value;
                const range = document.getElementById('car-range').value;
                const battery = document.getElementById('car-battery').value;
                const price = document.getElementById('car-price').value;
                const image = document.getElementById('car-image').value;

                if(!name || !brand) return alert("Car Name and Brand are required!");

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/cars.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                
                let carsArray = [];
                if (data.content) {
                    const decoded = decodeURIComponent(escape(atob(data.content)));
                    carsArray = decoded.trim() === "" || decoded.trim() === "{}" ? [] : JSON.parse(decoded);
                }

                carsArray.push({
                    id: Date.now(),
                    name, brand,
                    range_km: parseInt(range) || 0,
                    battery_kwh: parseFloat(battery) || 0,
                    price: price || "Price on request",
                    image: image || ""
                });

                await commitToGitHub('cars.json', JSON.stringify(carsArray, null, 2), data.sha);
                document.querySelectorAll('#add-car-tab input').forEach(input => input.value = '');
                
                document.getElementById('car-status').classList.remove('hidden');
                setTimeout(() => document.getElementById('car-status').classList.add('hidden'), 3000);
            } catch(err) { alert("Error saving car."); }
        }

        // Save New Blog Post
        async function saveNewBlog() {
            try {
                const title = document.getElementById('blog-title').value;
                const image = document.getElementById('blog-image').value;
                const content = document.getElementById('blog-content').value;

                if(!title || !content) return alert("Title and Content are required!");

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/blogs.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                
                let blogsArray = [];
                if (data.content) {
                    const decoded = decodeURIComponent(escape(atob(data.content)));
                    blogsArray = decoded.trim() === "" || decoded.trim() === "{}" ? [] : JSON.parse(decoded);
                }

                blogsArray.push({
                    id: Date.now(),
                    title, image, content,
                    date: new Date().toLocaleDateString()
                });

                await commitToGitHub('blogs.json', JSON.stringify(blogsArray, null, 2), data.sha);
                document.querySelectorAll('#add-blog-tab input, #add-blog-tab textarea').forEach(el => el.value = '');
                
                document.getElementById('blog-status').classList.remove('hidden');
                setTimeout(() => document.getElementById('blog-status').classList.add('hidden'), 3000);
            } catch(err) { alert("Error saving blog."); }
        }

        // Core Commit Function
        async function commitToGitHub(filename, contentStr, shaStr) {
            const encodedContent = btoa(unescape(encodeURIComponent(contentStr)));
            const body = {
                message: `Master update via panel: ${filename}`,
                content: encodedContent,
                sha: shaStr
            };

            const response = await fetch(`https://api.github.com/repos/${REPO}/contents/data/${filename}`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const err = await response.json();
                alert("GitHub Error: " + err.message);
            }
        }
    </script>
</body>
</html>
