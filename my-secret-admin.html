<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Secure Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    
    <!-- LOGIN SCREEN -->
    <div id="auth" class="min-h-screen flex items-center justify-center bg-gray-900">
        <div class="bg-white p-8 rounded shadow w-96">
            <h2 class="text-xl font-bold mb-4">Admin Login</h2>
            <input type="password" id="pat" placeholder="Enter GitHub Token (PAT)" class="w-full border p-2 rounded mb-4 focus:outline-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded font-bold">Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <div class="w-64 bg-gray-900 text-white p-4">
            <h1 class="font-bold text-xl mb-8 text-blue-400">EV Portal Control</h1>
            <button onclick="openTab('settings-tab')" class="block w-full text-left p-2 hover:bg-gray-700 rounded mb-2">⚙️ Site Settings</button>
            <button onclick="openTab('json-tab')" class="block w-full text-left p-2 hover:bg-gray-700 rounded mb-2">💻 Advanced Data</button>
            <button onclick="logout()" class="block w-full text-left p-2 text-red-400 mt-8 rounded hover:bg-gray-800">🚪 Logout</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 p-8 overflow-y-auto bg-gray-50">
            
            <!-- SETTINGS TAB -->
            <div id="settings-tab" class="tab-content hidden max-w-2xl bg-white p-6 rounded shadow">
                <h2 class="text-2xl font-bold mb-6 border-b pb-2">Website Settings</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Website Name</label>
                        <input type="text" id="set-name" class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Logo Image URL</label>
                        <input type="text" id="set-logo" class="w-full border p-2 rounded mt-1" placeholder="https://example.com/logo.png (Leave empty to use Text Name)">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Global SEO Title</label>
                        <input type="text" id="set-seo-title" class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Global SEO Description</label>
                        <textarea id="set-seo-desc" class="w-full border p-2 rounded mt-1" rows="3"></textarea>
                    </div>
                    <button onclick="saveSettings()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Update Settings</button>
                </div>
            </div>

            <!-- JSON EDITOR TAB -->
            <div id="json-tab" class="tab-content hidden max-w-4xl bg-white p-6 rounded shadow">
                <h2 class="text-2xl font-bold mb-4">Raw Data Manager</h2>
                <div class="flex gap-2 mb-4">
                    <button onclick="loadJson('cars.json')" class="bg-gray-200 px-3 py-1 rounded text-sm hover:bg-gray-300">Load Cars</button>
                    <button onclick="loadJson('blogs.json')" class="bg-gray-200 px-3 py-1 rounded text-sm hover:bg-gray-300">Load Blogs</button>
                </div>
                <h3 id="view-title" class="text-lg font-bold mb-2 text-blue-600"></h3>
                <textarea id="json-editor" class="w-full h-96 p-4 border rounded font-mono text-sm bg-gray-50"></textarea>
                <button id="save-json-btn" onclick="saveJson()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded font-bold">Push Data to GitHub</button>
            </div>

        </div>
    </div>

    <script>
        // === IMPORTANT: APNA GITHUB USERNAME AUR REPO NAME YAHAN DAALEIN ===
        const REPO = "jaatbott/ev-portal";

        
        let token = localStorage.getItem('pat');
        let currentSettingsSha = "";
        let currentJsonFile = "";
        let currentJsonSha = "";

        if(token) showDash();

        function login() {
            token = document.getElementById('pat').value;
            localStorage.setItem('pat', token);
            showDash();
        }

        function logout() {
            localStorage.removeItem('pat');
            location.reload();
        }

        function showDash() {
            document.getElementById('auth').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            openTab('settings-tab');
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            if(tabId === 'settings-tab') loadSettings();
        }

        // --- GITHUB API HELPER ---
        async function fetchFile(path) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if(!res.ok) throw new Error("Invalid Token or Repo Settings");
            return await res.json();
        }

        async function updateFile(path, contentObj, sha, message) {
            const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: message, content: contentBase64, sha: sha })
            });
            return res.ok;
        }

        // --- SETTINGS LOGIC ---
        async function loadSettings() {
            try {
                const data = await fetchFile('data/settings.json');
                currentSettingsSha = data.sha;
                const settings = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                document.getElementById('set-name').value = settings.website_name || "";
                document.getElementById('set-logo').value = settings.logo_url || "";
                document.getElementById('set-seo-title').value = settings.global_seo_title || "";
                document.getElementById('set-seo-desc').value = settings.global_seo_desc || "";
            } catch(e) {
                alert("Failed to load settings. Check Repo Name and Token.");
            }
        }

        async function saveSettings() {
            const newSettings = {
                website_name: document.getElementById('set-name').value,
                logo_url: document.getElementById('set-logo').value,
                global_seo_title: document.getElementById('set-seo-title').value,
                global_seo_desc: document.getElementById('set-seo-desc').value
            };

            const success = await updateFile('data/settings.json', newSettings, currentSettingsSha, "Updated Site Settings");
            if(success) {
                alert("Settings Updated! It may take 1-2 minutes to reflect on the live site.");
                loadSettings(); // Reload to get new SHA
            }
        }

        // --- JSON DATA LOGIC (Cars/Blogs) ---
        async function loadJson(filename) {
            try {
                currentJsonFile = `data/${filename}`;
                document.getElementById('view-title').innerText = `Currently Editing: ${filename}`;
                const data = await fetchFile(currentJsonFile);
                currentJsonSha = data.sha;
                
                const content = decodeURIComponent(escape(atob(data.content)));
                document.getElementById('json-editor').value = content;
            } catch(e) {
                alert("Error loading file.");
            }
        }

        async function saveJson() {
            try {
                const parsed = JSON.parse(document.getElementById('json-editor').value); // Validate JSON format
                const success = await updateFile(currentJsonFile, parsed, currentJsonSha, `Updated ${currentJsonFile}`);
                if(success) {
                    alert('Data Pushed to GitHub Successfully!');
                    loadJson(currentJsonFile.replace('data/', '')); // Reload to get new SHA
                }
            } catch(e) {
                alert("JSON Error: Please check for missing commas or brackets before saving.");
            }
        }
    </script>
</body>
</html>
