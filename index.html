<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — EV Portal</title>
<meta name="description" content="">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow">⚡ INDIA'S EV GUIDE — UPDATED WEEKLY</div>
    <h1 id="heroTitle">Every electric car in India, compared on real numbers.</h1>
    <p class="lead">Price, range, battery and charging time — laid out plainly so you can decide without the sales pitch.</p>
    <form class="hero-search" onsubmit="event.preventDefault(); document.getElementById('carSearch').value=this.q.value; filterCars();">
      <input type="text" id="carSearch" name="q" placeholder="Search cars — e.g. Nexon, Ioniq, under 15 lakh">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  </div>
</section>

<section class="section" id="cars">
  <div class="wrap">
    <div class="section-head">
      <h2>Electric cars</h2>
      <a class="view-all" href="compare.html">Compare two cars →</a>
    </div>
    <div class="grid grid-4" id="carsGrid">
      <div class="card"><div class="card-media skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      <div class="card"><div class="card-media skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      <div class="card"><div class="card-media skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      <div class="card"><div class="card-media skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
    </div>
  </div>
</section>

<div class="wrap"><div class="ad-slot" id="adSlot1">Advertisement</div></div>

<section class="section" id="blog">
  <div class="wrap">
    <div class="section-head"><h2>From the blog</h2></div>
    <div id="blogList"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/site.js"></script>
<script>
let DB = null;

async function init() {
  DB = await loadAllData();
  const { settings, cars, blogs } = DB;

  renderHeader(settings);
  renderFooter(settings);
  injectSettingsScripts(settings);

  injectSEO({
    title: settings.global_seo_title || 'EV Portal',
    description: settings.global_seo_desc,
    url: window.location.href,
  });
  injectJSONLD({
    '@context': 'https://schema.org',
    '@type': 'WebSite',
    name: settings.website_name,
    url: window.location.origin + window.location.pathname,
  });

  renderCars(cars);
  renderBlogs(blogs);
  renderAdSlot(document.getElementById('adSlot1'), settings);
}

function renderCars(cars) {
  const grid = document.getElementById('carsGrid');
  if (!cars.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>No cars listed yet</h3><p>Add your first EV from the admin panel.</p></div>`;
    return;
  }
  grid.innerHTML = cars.map(carCardHTML).join('');
}

function filterCars() {
  const q = (document.getElementById('carSearch').value || '').toLowerCase();
  const filtered = DB.cars.filter(c =>
    c.name.toLowerCase().includes(q) || (c.category || '').toLowerCase().includes(q)
  );
  renderCars(filtered);
  document.getElementById('cars').scrollIntoView({ behavior: 'smooth' });
}

function renderBlogs(blogs) {
  const el = document.getElementById('blogList');
  if (!blogs.length) {
    el.innerHTML = `<div class="empty-state"><h3>No posts yet</h3><p>Publish your first article from the admin panel.</p></div>`;
    return;
  }
  el.innerHTML = blogs
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .map(postCardHTML)
    .join('');
}

init();
</script>
</body>
</html>
