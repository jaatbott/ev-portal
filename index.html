<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">Loading...</title>
    <meta name="description" id="meta-desc" content="">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <!-- HEADER WITH LOGO -->
    <header class="bg-white shadow-sm sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img id="site-logo" src="" alt="Logo" class="h-10 hidden">
                <h1 class="text-2xl font-bold text-blue-600" id="site-name">EV Portal</h1>
            </a>
            <nav class="space-x-4">
                <a href="index.html" class="hover:text-blue-600">Home</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-8">
        <h2 class="text-2xl font-bold mb-6 border-b pb-2">Welcome to EV Portal</h2>
        <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12"></div>
    </main>

    <script>
        fetch('data/settings.json').then(r => r.json()).then(settings => {
            document.getElementById('meta-title').innerText = settings.global_seo_title;
            document.getElementById('meta-desc').content = settings.global_seo_desc;
            
            const logoEl = document.getElementById('site-logo');
            const nameEl = document.getElementById('site-name');
            
            // Logo Logic
            if(settings.logo_url) {
                logoEl.src = settings.logo_url;
                logoEl.classList.remove('hidden');
                nameEl.classList.add('hidden'); // Hide text if logo exists
            } else {
                nameEl.innerText = settings.website_name;
            }
        });
    </script>
</body>
</html>
