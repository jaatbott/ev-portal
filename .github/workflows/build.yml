name: Build static pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static pages
        run: node build.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cars blog pages sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-build static pages [skip build]"
          git push

      - name: Notify Google Indexing API (optional)
        if: ${{ secrets.GOOGLE_INDEXING_KEY != '' }}
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: node submit-to-google.js
