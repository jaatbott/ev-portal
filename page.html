<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — EV Portal</title>
<meta name="description" content="">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-field input,.form-field textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-family:var(--font-body);font-size:14.5px;background:#fff;
}
.form-field textarea{min-height:120px;resize:vertical}
</style>
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="wrap" style="padding-top:28px;max-width:720px" id="content">
  <p class="mono" style="font-size:12px;color:var(--muted)">Loading page…</p>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/site.js"></script>
<script>
async function init() {
  const slug = qs('slug') || 'about-us';
  const DB = await loadAllData();
  const { settings, pages } = DB;
  renderHeader(settings);
  renderFooter(settings);
  injectSettingsScripts(settings);

  const page = pages.find(p => p.slug === slug);
  const content = document.getElementById('content');

  if (!page) {
    content.innerHTML = `<div class="empty-state"><h3>Page not found</h3></div>`;
    return;
  }

  const prettyUrl = settings.site_url ? `${settings.site_url.replace(/\/$/, '')}/pages/${page.slug}/` : window.location.href;
  injectSEO({
    title: page.seo_title || page.title,
    description: page.seo_desc,
    url: prettyUrl,
  });

  let extra = '';
  if (slug === 'contact-us') {
    extra = `
      <form id="leadForm" style="margin-top:24px">
        <div class="form-field"><label>Your name</label><input type="text" name="name" required></div>
        <div class="form-field"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-field"><label>Message</label><textarea name="message" required></textarea></div>
        <input type="hidden" name="access_key" id="web3formsKey" value="${settings.web3forms_access_key || ''}">
        <button class="btn btn-primary" type="submit">Send message</button>
        <p id="formStatus" class="mono" style="font-size:12.5px;margin-top:10px"></p>
      </form>`;
  }

  content.innerHTML = `<h1>${page.title}</h1><div class="prose">${page.content || ''}</div>${extra}`;

  if (slug === 'contact-us') setupLeadForm(settings);
}

function setupLeadForm(settings) {
  const form = document.getElementById('leadForm');
  const status = document.getElementById('formStatus');
  if (!settings.web3forms_access_key) {
    status.textContent = 'Contact form is not configured yet — add a Web3Forms access key in Admin → Settings.';
    status.style.color = 'var(--muted)';
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!settings.web3forms_access_key) return;
    status.textContent = 'Sending…';
    status.style.color = 'var(--muted)';
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      const json = await res.json();
      if (json.success) {
        status.textContent = 'Message sent — we will get back to you soon.';
        status.style.color = 'var(--range-green)';
        form.reset();
      } else {
        throw new Error(json.message || 'Failed to send');
      }
    } catch (err) {
      status.textContent = 'Could not send message: ' + err.message;
      status.style.color = 'var(--danger)';
    }
  });
}

init();
</script>
</body>
</html>
